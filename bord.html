<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>PictoClass</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { height: 100%; }
  body { background: #fff; overflow: hidden; }
  .hint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #D1D5DB; font-size: 22px; pointer-events: none; text-align: center; padding: 20px; }

  /* Welcome (first run) */
  .welcome { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; padding: 24px; }
  body.welkom .welcome { display: flex; }
  body.welkom .hint { display: none; }
  .hero { max-width: 560px; text-align: left; }
  .hero img { width: 72px; height: 72px; }
  .hero h1 { font-size: 38px; margin: 12px 0 6px; }
  .hero p { font-size: 18px; color: var(--muted); margin: 0 0 22px; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .steps li { display: flex; gap: 14px; align-items: flex-start; font-size: 18px; }
  .steps b.n { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .steps li.done { color: var(--muted); }
  .steps li.done b.n { background: #16A34A; }

  .coach { position: fixed; display: none; max-width: 300px; background: #111827; color: #fff; border-radius: 14px; padding: 14px 16px; font-size: 16px; line-height: 1.35;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); pointer-events: none; z-index: 5; }
  .coach b { color: #FDE68A; }
  .coach::after { content: ''; position: absolute; width: 0; height: 0; border: 12px solid transparent; }
  .coach.right::after { right: -22px; top: calc(50% - 12px); border-left-color: #111827; }
  .coach.left::after { left: -22px; top: calc(50% - 12px); border-right-color: #111827; }
  /* Chrome's puzzle icon sits about 98px from the right edge (left of the profile picture and the ⋮ menu) */
  .coach.up::after { top: -22px; right: 68px; border-bottom-color: #111827; }
  .coach.pulse { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(-6px); } }
  body.welkom .coach.on { display: block; }
</style>
</head>
<body>
<div class="hint" id="hint" data-t="boardHint"></div>

<div class="welcome" id="welcome">
  <div class="hero">
    <img src="icons/icon128.png" alt="">
    <h1 data-t="welcomeTitle"></h1>
    <p data-t="welcomeLead"></p>
    <ol class="steps">
      <li id="s1"><b class="n">1</b><span data-t="step1"></span></li>
      <li id="s2"><b class="n">2</b><span data-t="step2"></span></li>
      <li id="s3"><b class="n">3</b><span data-t="step3"></span></li>
    </ol>
  </div>
</div>

<div class="coach right pulse" id="coachBubble" data-t="coachStart"></div>
<div class="coach up" id="coachPin" data-t="coachPin"></div>

<script src="picto.js"></script>
<script src="overlay.js"></script>
<script src="bord.js"></script>
</body>
</html>
