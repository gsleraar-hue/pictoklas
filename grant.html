<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>PictoClass – bubbel op elke website</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { padding: 22px 24px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; }
  #msg { margin-top: 12px; font-size: 13px; }
</style>
</head>
<body>
<h1>Bubbel op elke website</h1>
<p>Dan staat de PictoClass-bubbel meteen op elke website. Chrome vraagt daarvoor toestemming voor alle websites. PictoClass leest die pagina's niet; het zet er alleen de bubbel op. Uitzetten kan altijd via ✎ Aanpassen.</p>
<div class="row">
  <button class="pill primary" id="ok">Toestaan</button>
  <button class="pill" id="no">Niet nu</button>
</div>
<div id="msg" class="muted"></div>
<script src="grant.js"></script>
</body>
</html>
