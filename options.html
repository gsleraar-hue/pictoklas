<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>PictoClass – woorden & talen</title>
<link rel="stylesheet" href="ui.css">
<style>
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  section { background: var(--panel); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 16px 18px; margin-top: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line); cursor: pointer; user-select: none; }
  .chip input { margin: 0; }
  .chip.on { background: var(--soft); box-shadow: 0 0 0 1.5px var(--accent); font-weight: 600; }
  .main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: start; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .detail { position: sticky; top: 12px; }
  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .head .big { width: 76px; height: 76px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .head .big svg { width: 54px; height: 54px; }
  .head label { font-size: 12px; }
  .head input { font-size: 20px; font-weight: 700; width: 100%; }
  input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; background: #fff; color: var(--text); }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  td.name { width: 120px; font-weight: 600; }
  td.name small { display: block; font-weight: 400; color: var(--muted); }
  td.word input { width: 100%; font-size: 16px; }
  td.act { white-space: nowrap; text-align: right; }
  td.act > * { margin-left: 8px; }
  .st { font-size: 12px; display: block; margin-top: 3px; color: var(--muted); }
  .st.ok { color: #15803D; }
  .icon-btn { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
  .icon-btn.play { background: var(--accent); color: #fff; }
  .icon-btn.del { color: var(--muted); font-size: 18px; }
  .icon-btn.del:hover { color: #DC2626; background: #FEE2E2; }
  .icon-btn.rec { color: #DC2626; font-size: 16px; box-shadow: 0 0 0 1px #FCA5A5; }
  .icon-btn.rec:hover { background: #FEE2E2; }
  .icon-btn.rec.on { background: #DC2626; color: #fff; box-shadow: none; animation: recpulse 1s ease-in-out infinite; }
  @keyframes recpulse { 50% { box-shadow: 0 0 0 6px rgba(220,38,38,.25); } }
  tr.focus td { background: #FEF3C7; }
  .tip { margin-top: 12px; padding: 10px 12px; background: var(--soft); border-radius: 8px; font-size: 13px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .start { background: #EEF2FF; box-shadow: 0 0 0 1px #C7D2FE; }
  .ways { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .way { background: #fff; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .way > b { font-size: 14px; color: var(--accent); }
  @media (max-width: 860px) { .ways { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 860px) { .main { grid-template-columns: 1fr; } .detail { position: static; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>PictoClass <span id="ver" class="muted" style="font-size:14px;font-weight:400"></span></h1>
  <div class="muted" data-t="optIntro"></div>

  <section class="start">
    <h2 data-t="waysTitle"></h2>
    <div class="ways">
      <div class="way"><b data-t="way1t"></b><span data-t="way1"></span></div>
      <div class="way"><b data-t="way2t"></b><span data-t="way2"></span></div>
      <div class="way"><b data-t="way3t"></b><span data-t="way3"></span></div>
      <div class="way"><b data-t="way4t"></b><span data-t="way4"></span></div>
    </div>
  </section>

  <section class="main">
    <div>
      <h2 data-t="pictograms"></h2>
      <div class="grid" id="grid"></div>
      <div class="muted" style="font-size:12px;margin-top:8px" data-t="dotsLegend"></div>
    </div>
    <div class="detail" id="detail"></div>
  </section>

  <section>
    <h2 data-t="saveShare"></h2>
    <div class="row-actions">
      <button class="pill" id="export" data-t="exportAll"></button>
      <label class="pill" for="importFile" data-t="importDots"></label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <span class="muted" id="io" style="font-size:12px"></span>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px" data-t="saveShareTip"></div>
  </section>

  <section>
    <h2 data-t="shortcutsTitle"></h2>
    <div class="muted"><span data-t="shortcutsText"></span> <span class="link" id="shortcuts">chrome://extensions/shortcuts</span>.</div>
  </section>
</div>
<script src="picto.js"></script>
<script src="options.js"></script>
</body>
</html>
