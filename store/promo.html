<!doctype html>
<html lang="nl">
<head>

<title>Promotietegel</title>
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { background: linear-gradient(135deg, #2563EB, #1E3A8A); font-family: "Segoe UI", system-ui, sans-serif; color: #fff; position: relative; }
  .logo { position: absolute; left: 28px; top: 30px; width: 64px; height: 64px; }
  h1 { position: absolute; left: 28px; top: 104px; margin: 0; font-size: 40px; font-weight: 800; }
  p { position: absolute; left: 28px; top: 158px; margin: 0; width: 210px; font-size: 16px; line-height: 1.35; color: #DBEAFE; }
  .c { position: absolute; width: 90px; border-radius: 10px; background: #fff; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .c .i { height: 72px; display: flex; align-items: center; justify-content: center; }
  .c .i svg { width: 48px; height: 48px; }
  .c .l { color: #111827; font-weight: 800; font-size: 11.5px; text-align: center; padding: 6px 0 8px; }
</style>
</head>

<img class="logo" src="../icons/icon128.png" alt="">
<h1>PictoClass</h1>

<script src="../picto.js"></script>
<script src="promo.js"></script>

</html>
