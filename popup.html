<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>PictoClass</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 440px; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 4px; }
  h1 { font-size: 16px; margin: 0; }
  .langs { padding: 0 14px 8px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .chip { all: unset; cursor: pointer; padding: 3px 9px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line); background: var(--panel); font-weight: 600; }
  .chip:hover { box-shadow: 0 0 0 1px var(--accent); }
  .chip.on { background: var(--accent); color: #fff; box-shadow: none; }
  select.chip { appearance: none; -webkit-appearance: none; color: var(--accent); font: inherit; font-size: 12px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 4px 14px 12px; }
  footer { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  footer .pill { flex: 1; font-size: 13px; padding: 7px 6px; }
  .tip { margin: 0 14px 10px; font-size: 12px; color: var(--muted); }
  .note { margin: 0 14px 10px; padding: 8px 10px; background: #FEF3C7; border-radius: 8px; font-size: 12px; display: none; }
</style>
</head>
<body>
<header>
  <h1>PictoClass <span id="ver" class="muted" style="font-size:11px;font-weight:400"></span></h1>
  <span class="muted" style="font-size:12px">Klik = op het scherm</span>
</header>
<div class="langs" id="langs"></div>
<div class="note" id="note"></div>
<div class="grid" id="grid"></div>
<div class="tip">Sneller: de blauwe <b>bubbel</b> op de pagina, of <b>rechtermuisknop</b> &rarr; <b>PictoClass</b>.</div>
<footer>
  <button class="pill" id="dock" title="PictoClass-bubbel op deze pagina (Alt+Shift+O)">Bubbel</button>
  <button class="pill" id="clear">Alles weg</button>
  <button class="pill" id="bord">Leeg bord</button>
  <button class="pill primary" id="beheer">Woorden &amp; talen</button>
</footer>
<script src="picto.js"></script>
<script src="popup.js"></script>
</body>
</html>
