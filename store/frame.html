<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Screenshot</title>
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { background: #1E3A8A; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 34px 0 6px; font-size: 38px; font-weight: 800; letter-spacing: -.01em; }
  p { margin: 0 0 24px; font-size: 20px; color: #BFDBFE; }
  .shot { width: 1120px; height: 620px; border-radius: 14px; overflow: hidden; box-shadow: 0 16px 50px rgba(0,0,0,.35); background: #fff center/cover no-repeat; }
  .shot.contain { background-size: contain; background-color: #F1F5F9; }
</style>
</head>
<body>
<h1 id="t"></h1>
<p id="s"></p>
<div class="shot" id="img"></div>
<script src="frame.js"></script>
</body>
</html>
