<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Voorbeeldles</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #E8EEF6; font-family: "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .slide { width: 1180px; height: 700px; background: #fff; border-radius: 18px; box-shadow: 0 10px 40px rgba(15,23,42,.12); position: relative; overflow: hidden; }
  .slide h1 { position: absolute; left: 70px; top: 60px; margin: 0; font-size: 58px; color: #0F172A; }
  .slide p { position: absolute; left: 72px; top: 150px; margin: 0; font-size: 26px; color: #475569; width: 520px; line-height: 1.5; }
  .slide ul { position: absolute; left: 72px; top: 300px; margin: 0; padding: 0 0 0 28px; font-size: 26px; color: #334155; line-height: 1.8; }
  .art { position: absolute; right: 60px; bottom: 60px; width: 470px; height: 380px; border-radius: 16px; background: linear-gradient(180deg, #BAE6FD, #E0F2FE); }
  .tag { position: absolute; left: 72px; bottom: 50px; font-size: 18px; color: #94A3B8; }
</style>
</head>
<body>
<div class="slide">
  <h1>Het weer</h1>
  <p>Kijk naar de foto. Wat voor weer is het vandaag?</p>
  <ul><li>de zon schijnt</li><li>het regent</li><li>het waait</li></ul>
  <div class="art">
    <svg viewBox="0 0 470 380" width="470" height="380">
      <circle cx="330" cy="120" r="60" fill="#FACC15"/>
      <g fill="#fff"><circle cx="170" cy="190" r="55"/><circle cx="235" cy="170" r="70"/><circle cx="300" cy="200" r="50"/><rect x="120" y="190" width="230" height="60" rx="30"/></g>
      <g stroke="#38BDF8" stroke-width="8" stroke-linecap="round"><path d="M170 280l-12 30M230 280l-12 30M290 280l-12 30"/></g>
    </svg>
  </div>
  <div class="tag">Les 5 · Nederlands als tweede taal</div>
</div>
</body>
</html>
